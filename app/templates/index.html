{% extends 'base.html' %}

{% block content %}
<h1>Welcome to My Humble Portal!</h1>

<div class="nav-bar" style="margin: 1.5rem 0;">
    <a href="{{ url_for('main.cv') }}" class="button">CV / About Me</a>
    <a href="{{ url_for('main.contact') }}" class="button">Contact</a>
    <a href="{{ url_for('blog.blog_index') }}" class="button">Blog</a>
    <button type="button" class="button" onclick="toggleServerStats()">[ Server Stat ]</button>




    {% if current_user.is_authenticated %}
        <a href="{{ url_for('auth.dashboard') }}" class="button button-solid">Pirate Cave</a>
        <a href="{{ url_for('auth.logout') }}" class="button">Logout</a>
    {% else %}
        <a href="{{ url_for('auth.login') }}" class="button">Login</a>
    {% endif %}
</div>

<!-- Скрытая панель живой телеметрии сервера (открывается по кнопке [Server Stat]) -->
<div id="stats-panel" style="display: none; border: 1px solid var(--neon); background: var(--bg-panel); padding: 1rem; margin-bottom: 1.5rem;">
    <div style="display: flex; justify-content: space-between; border-bottom: 1px dashed var(--neon-dim); padding-bottom: 0.4rem; margin-bottom: 0.8rem;">
        <strong>root@dataforge:~# htop --summary</strong>
        <span id="stat-status" class="status-badge status-online">LOADING...</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.8rem; font-size: 0.9rem;">
        <div>Uptime: <strong id="stat-uptime">--</strong></div>
        <div>CPU Load: <strong id="stat-cpu">--</strong></div>
        <div>RAM: <strong id="stat-ram">--</strong></div>
        <div>Disk / ZFS: <strong id="stat-disk">--</strong></div>
    </div>
</div>

<footer class="terminal-footer">
  <div class="bash-output">
    <span class="typewriter" data-text="dataforge@guest~:$ whoami"></span>
    <span class="typewriter" data-text="dataforge@guest~:$ {{ current_user.username if current_user.is_authenticated else 'Guest' }}"></span>
    <span class="typewriter" data-text="dataforge@guest~:$ uptime"></span>
    <span class="typewriter" data-text="21:41:00 up 5 days, 3 users, load average: 0.14, 0.08, 0.01"></span>
    <span class="typewriter" data-text="dataforge@guest~:$ fortune | cowsay"></span>
    <span class="typewriter" data-text="( ASCII cow begins philosophizing... )"></span>
  </div>
</footer>

<script src="{{ url_for('static', filename='typewriter.js') }}?v=1.0.1"></script>
<script>
async function toggleServerStats() {
    const panel = document.getElementById('stats-panel');
    if (panel.style.display === 'none') {
        panel.style.display = 'block';
        try {
            const res = await fetch("{{ url_for('main.server_stats') }}");
            if (res.ok) {
                const data = await res.json();
                document.getElementById('stat-uptime').textContent = data.uptime;
                document.getElementById('stat-cpu').textContent = data.cpu_load;
                document.getElementById('stat-ram').textContent = data.ram;
                document.getElementById('stat-disk').textContent = data.disk;
                document.getElementById('stat-status').textContent = data.status;
            }
        } catch (e) {
            document.getElementById('stat-status').textContent = 'OFFLINE';
        }
    } else {
        panel.style.display = 'none';
    }
}
</script>
{% endblock %}
